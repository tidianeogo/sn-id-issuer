# Passerelle unique : c'est elle qu'exposent le port 8088 et le tunnel HTTPS.
#   /auth/...        -> Keycloak (realm public ; console d'administration interdite ici)
#   /v1/mimoto/...   -> Mimoto (profil « inji » ; utile pour Inji Wallet compilé sur ce Mimoto)
#   tout le reste    -> issuer (well-known, DID, contextes, /v1/credential, offre)
resolver 127.0.0.11 valid=10s ipv6=off;   # DNS Docker, résolution à la requête (services optionnels)

map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }
map $http_x_forwarded_host  $fwd_host  { default $http_x_forwarded_host;  "" $http_host; }

server {
    listen 80;
    client_max_body_size 5m;
    proxy_http_version 1.1;
    proxy_set_header Host              $fwd_host;
    proxy_set_header X-Forwarded-Host  $fwd_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;

    location = /gateway-health { return 200 "OK\n"; }

    # Administration Keycloak : uniquement en direct sur http://127.0.0.1:8080/auth (jamais via le tunnel)
    location ^~ /auth/admin/          { return 403; }
    location ^~ /auth/realms/master/  { return 403; }

    location /auth/ {
        set $kc http://keycloak:8080;
        proxy_pass $kc;
    }
    location /v1/mimoto/ {
        set $mimoto http://mimoto-service:8099;
        proxy_pass $mimoto;
    }
    location / {
        set $issuer http://issuer:8000;
        proxy_pass $issuer;
    }
}
